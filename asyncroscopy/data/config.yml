trees:
  - path: /
    tree: tiled.catalog:from_uri
    args:
      uri: ${ASYNCROSCOPY_TILED_CATALOG}
      readable_storage:
        - ${ASYNCROSCOPY_ACQUISITION_DIR}
      writable_storage:
        - ${ASYNCROSCOPY_ACQUISITION_DIR}
      adapters_by_mimetype:
        application/x-hdf5: asyncroscopy.data.data_reader:NSIDAdapter
