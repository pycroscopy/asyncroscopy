# MCP-only startup config.
#
# Start the Tango/device stack first, then run this on the MCP host:
#
#   uv run startup_scripts/run_mcp.py --yaml configs/mcp_dt.yaml
#
# If MCP runs on a separate computer, set tango.host to the Tango database
# machine/IP. Set mcp.http_host to 0.0.0.0 when other machines need to connect.

tango:
  host: 127.0.0.1
  port: 9094

mcp:
  name: Spectra300_MCP
  transport: streamable-http
  http_host: 0.0.0.0
  http_port: 8000
  data_device_address: asyncroscopy/data/default
  quiet: true
  blocked_classes:
    - DataBase
    - DServer
  blocked_functions:
    "*":
      - Init
      - Kill
      - RestartServer
  # Optional Tango command allowlist. Leave empty to include all non-blocked
  # commands. Entries may be "command" or "Class.command".
  # list_devices and get_data_from_key are always included.
  include_only_functions:
    - DigitalTwinDiffraction.acquire_camera_image
    - DigitalTwinDiffraction.acquire_scanned_data_advanced
    - DigitalTwinDiffraction.acquire_scanned_image
    - DigitalTwinDiffraction.acquire_spectrum
    - DigitalTwinDiffraction.place_beam
    - DigitalTwinDiffraction.place_beam_list
